<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 美國研修 C組行程</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #eef4ff;
      color: #0056b3;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 10px 0;
      color: #111827;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #0071e3;
      color: #ffffff;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #005bb5;
    }
    .note {
      font-size: 12px;
      color: #8c95a6;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">NITORI 2026 美國研修</div>
    <h2>C組 行事曆加入</h2>
    <p>包含 10/5～10/12 全程考察、各行程期限<br>10/11 LA市區觀光與返程航班排程。</p>

    <!-- 單次匯入核心按鈕：直接開啟 .ics 檔案 -->
    <a href="./2026_LA_Seminar_Ready_To_Import.ics" class="btn">
      📅 單次加入行事曆
    </a>

    <div class="note">
      * 點擊按鈕後，請在彈出的視窗點選「<b>全部加入</b>」即可。<br>
      * iPhone 建議使用 Safari 開啟此頁面。
    </div>
  </div>

</body>
</html>
