<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 美國研修 C組行程</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #eef4ff;
      color: #0056b3;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 10px 0;
      color: #111827;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      background-color: #0071e3;
      color: #ffffff;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #005bb5;
    }
    .note {
      font-size: 12px;
      color: #8c95a6;
      margin-top: 22px;
      line-height: 1.6;
      text-align: left;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">NITORI 2026 美國研修</div>
    <h2>C組 行事曆加入</h2>
    <p>涵蓋 10/5～10/12 全程考察行程、各期限提醒<br>10/11 洛杉磯市區觀光與返程航班。</p>

    <!-- 智慧跳轉按鈕 -->
    <button id="addCalendarBtn" class="btn">
      📅 加入行程至行事曆
    </button>

    <div class="note">
      <b>使用提示：</b><br>
      • <b>iPhone</b>：點擊後會彈出系統視窗，點選「全部加入」即可。<br>
      • <b>Android</b>：點擊後將直接下載檔案，開啟後選 Google 日曆匯入。
    </div>
  </div>

  <script>
    document.getElementById('addCalendarBtn').addEventListener('click', function() {
      // 判斷是否為 iOS 裝置 (iPhone, iPad, iPod)
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      const domain = 'tankaui.github.io/nitori-la-2026';
      const fileName = '2026_LA_Seminar_Ready_To_Import.ics';

      if (isIOS) {
        // iOS 使用 webcal:// 協定強制喚起系統行事曆存檔提示
        window.location.href = 'webcal://' + domain + '/' + fileName;
      } else {
        // Android / PC 直接下載 .ics 檔案
        const downloadLink = document.createElement('a');
        downloadLink.href = 'https://' + domain + '/' + fileName;
        downloadLink.download = fileName;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      }
    });
  </script>

</body>
</html>
