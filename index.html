<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 美國研修 C組行程</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 36px 26px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 390px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #eef4ff;
      color: #0056b3;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 10px 0;
      color: #111827;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 26px 0;
    }
    .btn-main {
      display: block;
      width: 100%;
      background-color: #0071e3;
      color: #ffffff;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
      transition: all 0.2s ease;
      margin-bottom: 14px;
    }
    .btn-main:active {
      transform: scale(0.98);
      background-color: #005bb5;
    }
    .btn-settings {
      display: block;
      width: 100%;
      background-color: #f3f4f6;
      color: #4b5563;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .btn-settings:active {
      background-color: #e5e7eb;
    }
    .guide-box {
      font-size: 12px;
      color: #6b7280;
      margin-top: 22px;
      line-height: 1.6;
      text-align: left;
      background: #f9fafb;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #edf0f3;
    }
    .guide-box b {
      color: #1f2937;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">NITORI 2026 美國研修</div>
    <h2>C組 專屬行程行事曆</h2>
    <p>包含 10/5～10/12 全考察排程、各期限提醒<br>10/11 洛杉磯市區觀光與 回程BR0005 航班。</p>

    <!-- 核心一鍵訂閱按鈕 -->
    <a href="webcal://tankaui.github.io/nitori-la-2026/2026_LA_Seminar_Ready_To_Import.ics" class="btn-main">
      📅 訂閱專屬行事曆
    </a>

    <!-- 輔助前往系統設定按鈕（供事後快速刪除） -->
    <a href="App-Prefs:root=ACCOUNT_SETTINGS" class="btn-settings">
      ⚙️ 前往手機設定（管理 / 刪除訂閱）
    </a>

    <div class="guide-box">
      <b>📌 iPhone 訂閱教學：</b><br>
      1. 點擊「訂閱專屬行事曆」按鈕。<br>
      2. 畫面彈出「加入訂閱行事曆」時，直接點擊 <b>「尋找」</b>。<br>
      3. 確認行程名稱後點選 <b>「加入」</b>，即會在手機建立獨立日曆（不與私人行程混淆）。<br><br>
      <b>🗑️ 研修結束後如何一鍵全刪：</b><br>
      點擊上方「前往手機設定」按鈕 ➜ <b>行事曆</b> ➜ <b>已訂閱的行事曆</b> ➜ 點選此行程並按 <b>刪除帳號</b>，即可整本移除。
    </div>
  </div>

</body>
</html>
