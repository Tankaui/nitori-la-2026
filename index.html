<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 美國研修 C組行程</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 36px 26px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 390px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #eef4ff;
      color: #0056b3;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 10px 0;
      color: #111827;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 26px 0;
    }
    .btn-main {
      display: block;
      width: 100%;
      background-color: #0071e3;
      color: #ffffff;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
      transition: all 0.2s ease;
      margin-bottom: 14px;
    }
    .btn-main:active {
      transform: scale(0.98);
      background-color: #005bb5;
    }
    .btn-action {
      display: block;
      width: 100%;
      background-color: #f3f4f6;
      color: #374151;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:active {
      background-color: #e5e7eb;
    }
    .guide-box {
      font-size: 13px;
      color: #4b5563;
      margin-top: 22px;
      line-height: 1.6;
      text-align: left;
      background: #f9fafb;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #edf0f3;
    }
    .guide-box b {
      color: #111827;
    }
    /* 彈出說明視窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: #fff;
      padding: 24px;
      border-radius: 18px;
      max-width: 320px;
      width: 100%;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
    }
    .modal-content h3 {
      margin-top: 0;
      color: #111827;
      font-size: 17px;
    }
    .modal-close {
      display: block;
      width: 100%;
      background: #0071e3;
      color: #fff;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      margin-top: 18px;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">NITORI 2026 美國研修</div>
    <h2>C組 行程行事曆</h2>
    <p>含 10/5～10/12 全程考察排程、各期限提醒<br>10/11 洛杉磯市區觀光與 回程BR0005 航班。</p>

    <!-- 核心一鍵訂閱按鈕 -->
    <a href="webcal://tankaui.github.io/nitori-la-2026/2026_LA_Seminar_Ready_To_Import.ics" class="btn-main">
      📅 訂閱行程行事曆
    </a>

    <!-- 刪除說明按鈕 -->
    <button class="btn-action" onclick="document.getElementById('deleteModal').style.display='flex'">
      🗑️ 如何刪除 / 取消訂閱？
    </button>

    <div class="guide-box">
      <b>📌 訂閱加入方式：</b><br>
      ⑴　點擊上方藍色訂閱按鈕<br>⑵　彈出視窗點選 <b>「尋找」</b> <br>⑶　點選 <b>「加入」</b>，即會在手機建立獨立日曆。
    </div>
  </div>

  <!-- 刪除教學彈出視窗 -->
  <div id="deleteModal" class="modal-overlay" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-content">
      <h3>🗑️ 如何清空此日曆？</h3>
      1. 打開手機內建 <b>「行事曆」App</b>。<br>
      2. 點擊螢幕下方中間的 <b>「行事曆」</b>。<br>
      3. 找到「已訂閱」區塊，點選該研修行程旁的 <b>「ℹ️」</b> 圖示。<br>
      4. 滑到最底點選 <b>「刪除行事曆」</b>，73 個行程便會全數清空。
      <button class="modal-close" onclick="document.getElementById('deleteModal').style.display='none'">我知道了</button>
    </div>
  </div>

</body>
</html>
